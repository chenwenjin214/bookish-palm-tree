<style>
  /* ============ 设计令牌 ============ */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #fbfbfe;
    --text: #1c2230;
    --text-muted: #5c6577;
    --primary: #4f46e5;
    --primary-2: #7c6cf0;
    --accent: #f59e0b;
    --track: #e9ebf3;
    --border: rgba(20, 24, 40, 0.08);
    --border-strong: rgba(20, 24, 40, 0.22);
    --shadow: 0 10px 30px -12px rgba(31, 38, 80, 0.18);
    --shadow-hover: 0 18px 40px -14px rgba(31, 38, 80, 0.28);
    --ph-bg: rgba(79, 70, 229, 0.06);
    --nav-bg: rgba(255, 255, 255, 0.72);
    --radius: 16px;
    --radius-sm: 10px;
  }
  html[data-theme="dark"] {
    --bg: #0e1018;
    --surface: #171a24;
    --surface-2: #1d212e;
    --text: #e9ecf4;
    --text-muted: #9aa3b6;
    --primary: #8b8cf8;
    --primary-2: #a9a6fb;
    --accent: #fbbf24;
    --track: #2a2f3d;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.24);
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
    --shadow-hover: 0 18px 40px -14px rgba(0, 0, 0, 0.6);
    --ph-bg: rgba(139, 140, 248, 0.12);
    --nav-bg: rgba(18, 20, 28, 0.72);
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color 0.3s ease, color 0.3s ease;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(60vw 60vw at 12% -8%, rgba(79, 70, 229, 0.12), transparent 60%),
      radial-gradient(50vw 50vw at 105% 8%, rgba(245, 158, 11, 0.10), transparent 55%),
      radial-gradient(40vw 40vw at 50% 120%, rgba(124, 108, 240, 0.10), transparent 60%);
    pointer-events: none;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(980px, 92vw); margin: 0 auto; }

  /* ============ 导航 ============ */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    width: min(980px, 92vw);
    margin: 0 auto;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .nav-brand {
    font-weight: 800;
    letter-spacing: 0.5px;
    font-size: 17px;
    white-space: nowrap;
    background: linear-gradient(120deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .nav-links {
    display: flex;
    gap: 4px;
    margin-left: auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a {
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap;
    transition: color 0.2s, background 0.2s;
  }
  .nav-links a:hover { color: var(--text); background: var(--surface-2); }
  .nav-links a.active { color: var(--primary); background: var(--ph-bg); font-weight: 600; }
  .nav-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
  }
  .icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ============ 通用区块 ============ */
  section { padding: 64px 0 8px; scroll-margin-top: 76px; }
  .sec-head { margin-bottom: 26px; }
  .sec-kicker {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--primary);
    opacity: 0.85;
  }
  .sec-title { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .sec-sub { color: var(--text-muted); margin-top: 6px; font-size: 15px; }

  /* ============ Hero ============ */
  .hero { padding-top: 96px; }
  .hero-card {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 28px;
    align-items: center;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .hero-card::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.18), transparent 70%);
    pointer-events: none;
  }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 24px;
    display: grid; place-items: center;
    font-size: 40px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.5);
  }
  .hero-name { font-size: 32px; font-weight: 800; line-height: 1.2; }
  .hero-title {
    color: var(--primary);
    font-weight: 600;
    margin-top: 4px;
    font-size: 16px;
  }
  .hero-bio { color: var(--text-muted); margin-top: 12px; max-width: 60ch; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .badge {
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--ph-bg);
    border: 1px solid var(--border);
    color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
  }
  .contact { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    border-radius: 12px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .btn-primary {
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    color: #fff; border: none;
  }
  .contact-loc { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 14px; padding: 9px 4px; }
  .contact-loc svg { width: 16px; height: 16px; }

  /* ============ 占位芯片 ============ */
  .ph {
    display: inline-block;
    font-size: 0.82em;
    padding: 0.05em 0.5em;
    margin: 0 0.12em;
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    color: var(--text-muted);
    background: var(--ph-bg);
    vertical-align: baseline;
  }

  /* ============ 亮点 ============ */
  .grid-hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .hl-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    position: relative;
    overflow: hidden;
  }
  .hl-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .hl-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: var(--ph-bg);
    color: var(--primary);
    margin-bottom: 14px;
  }
  .hl-icon svg { width: 22px; height: 22px; }
  .hl-title { font-size: 16px; font-weight: 700; }
  .hl-desc { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
  .hl-metric {
    margin-top: 12px;
    display: inline-block;
    font-size: 14px; font-weight: 800;
    color: var(--accent);
  }

  /* ============ Tabs ============ */
  .tablist {
    display: flex; flex-wrap: wrap; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px;
    width: fit-content;
    max-width: 100%;
    box-shadow: var(--shadow);
  }
  .tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] {
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    color: #fff;
    box-shadow: 0 6px 16px -6px rgba(79, 70, 229, 0.5);
  }
  .tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .tabpanels { margin-top: 22px; }
  .tabpanel { animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ============ 经历条目 ============ */
  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-sm);
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  .item:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .item-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .item-title { font-size: 17px; font-weight: 700; }
  .item-sub { color: var(--primary); font-size: 14px; font-weight: 600; margin-top: 2px; }
  .item-meta {
    font-size: 13px; color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .item-example { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-style: italic; }
  .item-bullets { margin-top: 12px; padding-left: 18px; }
  .item-bullets li { margin: 6px 0; color: var(--text); }
  .item-bullets li::marker { color: var(--primary); }

  /* ============ 技能矩阵 ============ */
  .grid-sk { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .sk-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .sk-cat { font-size: 15px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .sk-cat::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, var(--primary), var(--accent)); }
  .sk-row { margin-bottom: 14px; }
  .sk-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .sk-label .lv { color: var(--text-muted); font-size: 12px; }
  .bar { height: 9px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar > span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    border-radius: 99px;
    transition: width 1.1s cubic-bezier(.22,.61,.36,1);
  }
  .sk-badges { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ============ 评价 ============ */
  .eval-card {
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .eval-list { list-style: none; display: grid; gap: 14px; }
  .eval-list li {
    position: relative; padding-left: 28px;
    color: var(--text);
  }
  .eval-list li::before {
    content: ""; position: absolute; left: 0; top: 9px;
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: 0 0 0 4px var(--ph-bg);
  }

  /* ============ 页脚 ============ */
  footer {
    margin-top: 56px;
    border-top: 1px solid var(--border);
    padding: 26px 0 40px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ============ 返回顶部 ============ */
  .to-top {
    position: fixed; right: 22px; bottom: 22px;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--primary);
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(16px); pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 40;
  }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .to-top:hover { transform: translateY(-3px); }
  .to-top svg { width: 20px; height: 20px; }

  /* ============ 滚动揭示 ============ */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
    .badges, .contact { justify-content: center; }
    .hero-bio { margin-left: auto; margin-right: auto; }
    .sec-title { font-size: 22px; }
    .nav-brand { font-size: 15px; }
  }

  /* ============ 动效降级 ============ */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .reveal { opacity: 1; transform: none; }
    .bar > span { width: var(--w, 0); }
  }

  /* ============ 打印 ============ */
  @media print {
    html[data-theme="dark"] { --bg:#fff; --surface:#fff; --surface-2:#fff; --text:#000; --text-muted:#333; --border:#ccc; }
    body { background: #fff; color: #000; }
    body::before { display: none; }
    .nav, .to-top, .nav-actions { display: none !important; }
    section { padding: 22px 0 6px; scroll-margin-top: 0; }
    .hero { padding-top: 0; }
    .tablist { display: none !important; }
    .tabpanel { display: block !important; animation: none !important; }
    .item, .hl-card, .sk-card, .hero-card, .eval-card { box-shadow: none; break-inside: avoid; }
    .reveal { opacity: 1; transform: none; }
    .bar > span { width: var(--w, 0); }
    a { color: #000; }
  }
</style>
</head>

  /* ===================== 工具函数 ===================== */
  const ICON = {
    cert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5 8 22l4-2 4 2-1-7.5"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
    flask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-6"/></svg>',
    data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>'
  };

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // 将 {ph:提示} 占位符渲染为虚线芯片
  function fmt(str) {
    return escapeHtml(str).replace(/\{ph:([^}]*)\}/g, '<span class="ph" title="待补充信息">$1</span>');
  }

  /* ===================== 渲染 ===================== */
  function renderHero() {
    document.getElementById("brand").textContent = resume.name;
    document.getElementById("heroName").textContent = resume.name;
    document.getElementById("heroTitle").textContent = resume.title;
    document.getElementById("heroBio").textContent = resume.bio;
    document.getElementById("avatar").textContent = resume.name.charAt(0);
    document.getElementById("footName").textContent = resume.name;
    document.getElementById("updated").textContent = resume.updated;
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("badges").innerHTML =
      resume.badges.map(b => `<span class="badge">${escapeHtml(b)}</span>`).join("");

    const c = resume.contact;
    let html = "";
    if (c.phone) {
      html += `<a class="btn btn-primary" href="tel:${escapeHtml(c.phone)}">${ICON.phone}<span>${escapeHtml(c.phone)}</span></a>`;
    }
    const email = (c.emailParts || []).join("");
    if (email) {
      html += `<button class="btn" id="copyEmail">${ICON.mail}<span>复制邮箱</span></button>`;
    }
    if (c.location) {
      html += `<span class="contact-loc">${ICON.pin}<span>${fmt(c.location)}</span></span>`;
    }
    document.getElementById("contact").innerHTML = html;

    if (email) {
      const btn = document.getElementById("copyEmail");
      btn.addEventListener("click", () => {
        const done = () => {
          const span = btn.querySelector("span");
          const old = span.textContent;
          span.textContent = "已复制 ✓";
          setTimeout(() => (span.textContent = old), 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(done).catch(done);
        } else {
          const t = document.createElement("textarea");
          t.value = email; document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(t); done();
        }
      });
    }
  }

  function renderHighlights() {
    const grid = document.getElementById("highlightsGrid");
    grid.innerHTML = resume.highlights.map(h => `
      <div class="hl-card reveal">
        <div class="hl-icon">${ICON[h.icon] || ICON.cert}</div>
        <div class="hl-title">${escapeHtml(h.title)}</div>
        <div class="hl-desc">${escapeHtml(h.desc)}</div>
        <div class="hl-metric">${fmt(h.metric)}</div>
      </div>`).join("");
  }

  function itemCard(it) {
    const example = it.example ? `<p class="item-example">${escapeHtml(it.example)}</p>` : "";
    const meta = it.meta ? `<span class="item-meta">${fmt(it.meta)}</span>` : "";
    const bullets = (it.bullets || []).map(b => `<li>${fmt(b)}</li>`).join("");
    return `<article class="item reveal">
      <div class="item-head">
        <div>
          <h4 class="item-title">${fmt(it.title)}</h4>
          <p class="item-sub">${escapeHtml(it.sub || "")}</p>
          ${example}
        </div>
        ${meta}
      </div>
      <ul class="item-bullets">${bullets}</ul>
    </article>`;
  }

  function renderExperience() {
    const root = document.getElementById("expTabs");
    const tablist = document.createElement("div");
    tablist.className = "tablist";
    tablist.setAttribute("role", "tablist");
    tablist.setAttribute("aria-label", "经历分类");
    const panels = document.createElement("div");
    panels.className = "tabpanels";

    resume.experience.forEach((tab, i) => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.setAttribute("role", "tab");
      btn.id = "tab-" + tab.id;
      btn.setAttribute("aria-controls", "panel-" + tab.id);
      btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
      btn.tabIndex = i === 0 ? 0 : -1;
      btn.textContent = tab.label;
      btn.addEventListener("click", () => selectTab(tab.id));
      tablist.appendChild(btn);

      const panel = document.createElement("div");
      panel.className = "tabpanel";
      panel.id = "panel-" + tab.id;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", "tab-" + tab.id);
      panel.hidden = i !== 0;
      panel.innerHTML = tab.items.map(itemCard).join("");
      panels.appendChild(panel);
    });

    root.appendChild(tablist);
    root.appendChild(panels);

    tablist.addEventListener("keydown", (e) => {
      const tabs = Array.from(tablist.querySelectorAll(".tab"));
      const idx = tabs.indexOf(document.activeElement);
      if (idx < 0) return;
      let next = null;
      if (e.key === "ArrowRight") next = (idx + 1) % tabs.length;
      else if (e.key === "ArrowLeft") next = (idx - 1 + tabs.length) % tabs.length;
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = tabs.length - 1;
      if (next !== null) {
        e.preventDefault();
        tabs[next].focus();
        selectTab(resume.experience[next].id);
      }
    });
  }

  function selectTab(id) {
    const tabs = document.querySelectorAll("#expTabs .tab");
    const panels = document.querySelectorAll("#expTabs .tabpanel");
    tabs.forEach(t => {
      const on = t.id === "tab-" + id;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
    });
    panels.forEach(p => { p.hidden = p.id !== "panel-" + id; });
  }

  function renderSkills() {
    const grid = document.getElementById("skillsGrid");
    grid.innerHTML = resume.skills.map(s => {
      if (s.type === "badge") {
        const badges = s.items.map(i => `<span class="badge">${escapeHtml(i.name)}</span>`).join("");
        return `<div class="sk-card reveal">
          <div class="sk-cat">${escapeHtml(s.cat)}</div>
          <div class="sk-badges">${badges}</div>
        </div>`;
      }
      const rows = s.items.map(i => `
        <div class="sk-row">
          <div class="sk-label"><span>${escapeHtml(i.name)}</span><span class="lv">${i.level}%</span></div>
          <div class="bar"><span data-w="${i.level}"></span></div>
        </div>`).join("");
      return `<div class="sk-card reveal">
        <div class="sk-cat">${escapeHtml(s.cat)}</div>
        ${rows}
      </div>`;
    }).join("");
  }

  function renderEvaluation() {
    document.getElementById("evalList").innerHTML =
      resume.evaluation.map(e => `<li>${escapeHtml(e)}</li>`).join("");
  }

  /* ===================== 主题 ===================== */
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';

  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("resume-theme", t); } catch (e) {}
    document.getElementById("themeBtn").innerHTML = t === "dark" ? sun : moon;
  }
  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("resume-theme"); } catch (e) {}
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(saved || (prefersDark ? "dark" : "light"));
  }

  /* ===================== 交互 ===================== */
  function initScrollReveal() {
    const els = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) {
      els.forEach(el => el.classList.add("in"));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add("in");
          // 技能条动画
          en.target.querySelectorAll(".bar > span").forEach(sp => {
            sp.style.width = sp.getAttribute("data-w") + "%";
          });
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
  }

  function initToTop() {
    const btn = document.getElementById("toTop");
    const onScroll = () => btn.classList.toggle("show", window.scrollY > 420);
    window.addEventListener("scroll", onScroll, { passive: true });
    btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    onScroll();
  }

  function initScrollSpy() {
    const links = document.querySelectorAll(".nav-links a");
    const map = {};
    links.forEach(a => { map[a.getAttribute("href").slice(1)] = a; });
    const sections = document.querySelectorAll("main section[id]");
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          links.forEach(l => l.classList.remove("active"));
          if (map[en.target.id]) map[en.target.id].classList.add("active");
        }
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    sections.forEach(s => io.observe(s));
  }

  /* ===================== 启动 ===================== */
  renderHero();
  renderHighlights();
  renderExperience();
  renderSkills();
  renderEvaluation();
  initTheme();
  document.getElementById("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    setTheme(cur === "dark" ? "light" : "dark");
  });
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  initScrollReveal();
  initToTop();
  initScrollSpy();
</script>
